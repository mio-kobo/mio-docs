name: Documentation CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  MIO_DOCS_SITE_URL: https://mio.kaelexvp.cc
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: npm run check:release -- --production
      - run: npm run types:check
      - run: npm run check:links
      - run: npm run check:playground
      - run: npm run check:tutorial
      - run: npm run build
      - name: Test the static preview
        env:
          BASE_URL: http://127.0.0.1:3210
        run: |
          npm run start -- --port 3210 > /tmp/mio-static-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 "$BASE_URL/" > /dev/null
          npm run test:versions
          npm run test:release
          npm run check:links
