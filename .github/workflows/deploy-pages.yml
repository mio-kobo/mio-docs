name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  MIO_DOCS_SITE_URL: https://mio.kaelexvp.cc

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - run: npm run types:check
      - run: npm run check:links
      - run: npm run check:playground
      - run: npm run check:tutorial
      - run: npm run test:versions
      - run: npm run test:release
      - run: npm run build
      - name: Check the exported site over HTTP
        run: |
          npm run start -- --port 3210 > /tmp/mio-static-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3210/ > /dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3210 npm run check:links
          BASE_URL=http://127.0.0.1:3210 npm run test:versions
          BASE_URL=http://127.0.0.1:3210 npm run test:release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
